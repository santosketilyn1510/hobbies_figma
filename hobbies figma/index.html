<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus hobbies</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;

            /* IMAGEM DE FUNDO */
            background-image: url("fundo\ pg\ inicial.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border: 2px solid #168ee5;

            font-family: Georgia, "Times New Roman", serif;
        }


        /* TÍTULO NO CANTO SUPERIOR ESQUERDO */

        .titulo {
            position: absolute;

            top: 42px;
            left: 95px;

            font-size: 27px;
            line-height: 1.05;

            font-weight: normal;

            color: #111;
        }


        /* ÁREA DO LOGIN */

        .login {
            position: absolute;

            top: 84px;
            left: 50%;

            transform: translateX(-50%);

            width: 280px;

            text-align: center;
        }


        /* BEM VINDA */

        .login h1 {
            margin: 0 0 10px 0;

            font-size: 20px;

            font-style: italic;

            font-weight: normal;
        }


        /* TEXTO */

        .login p {
            margin: 0 0 35px 0;

            font-size: 17px;

            line-height: 18px;
        }


        /* CAMPOS DE EMAIL E SENHA */

        .campo {
            display: block;

            width: 214px;
            height: 30px;

            margin: 0 auto 15px auto;

            border: none;

            background-color: rgba(205, 202, 201, 0.85);

            padding: 5px 8px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 16px;

            outline: none;
        }


        .campo::placeholder {
            color: #222;

            opacity: 1;
        }


        /* BOTÃO ENTRAR */

        .entrar {
            display: block;

            width: 214px;
            height: 31px;

            margin: 0 auto;

            border: none;

            background-color: rgba(187, 215, 240, 0.9);

            font-family: Georgia, "Times New Roman", serif;

            font-size: 16px;

            cursor: pointer;
        }


        /* EFEITO DO BOTÃO */

        .entrar:hover {
            background-color: rgba(170, 205, 235, 0.95);
        }


        /* ESQUECI MINHA SENHA */

        .esqueci {
            display: block;

            margin-top: 14px;

            font-size: 11px;

            color: #555;

            text-decoration: none;
        }


        /* PARTE DE CRIAR CONTA */

        .conta {
            margin-top: 13px;

            font-size: 12px;

            line-height: 15px;
        }


        .conta a {
            color: #4d8bc5;

            text-decoration: none;
        }


        .conta a:hover {
            text-decoration: underline;
        }

    </style>
</head>


<body>


    <!-- TÍTULO -->

    <div class="titulo">
        Meus<br>
        hobbies
    </div>



    <!-- LOGIN -->

    <div class="login">

        <h1>
            Bem vinda de volta!
        </h1>


        <p>
            faça login para acessar meu<br>
            mundo e descobrir mes<br>
            hobbies!
        </p>



        <form>

            <!-- EMAIL -->

            <input
                type="email"
                class="campo"
                placeholder="email:"
            >


            <!-- SENHA -->

            <input
                type="password"
                class="campo"
                placeholder="senha:"
            >


            <!-- ENTRAR -->

            <button
                type="submit"
                class="entrar">
                entrar
            </button>

        </form>



        <!-- ESQUECI SENHA -->

        <a href="#" class="esqueci">
            esqueci minha senha
        </a>



        <!-- CRIAR CONTA -->

        <div class="conta">

            ainda não tem uma conta?<br>

            <a href="cadastro.html">
                criar conta
            </a>

        </div>

    </div>


</body>

</html>
